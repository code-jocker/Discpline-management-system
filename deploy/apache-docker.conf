ServerName localhost

<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to sensitive paths
    <DirectoryMatch "^/var/www/html/(storage|workers|deploy|database)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/sbms-error.log
    CustomLog ${APACHE_LOG_DIR}/sbms-access.log combined
</VirtualHost>
