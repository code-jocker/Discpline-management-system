; SBMS Supervisor configuration
; Copy to /etc/supervisor/conf.d/sbms.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update

[program:sbms-queue-notifications]
command         = php /var/www/html/workers/queue-worker.php notifications
user            = www-data
autostart       = true
autorestart     = true
startretries    = 5
stdout_logfile  = /var/log/supervisor/sbms-queue-notifications.log
stderr_logfile  = /var/log/supervisor/sbms-queue-notifications.err.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3

[program:sbms-queue-sms]
command         = php /var/www/html/workers/queue-worker.php sms
user            = www-data
autostart       = true
autorestart     = true
startretries    = 5
stdout_logfile  = /var/log/supervisor/sbms-queue-sms.log
stderr_logfile  = /var/log/supervisor/sbms-queue-sms.err.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3

[program:sbms-queue-ai-risk]
command         = php /var/www/html/workers/queue-worker.php ai_risk
user            = www-data
autostart       = true
autorestart     = true
startretries    = 5
stdout_logfile  = /var/log/supervisor/sbms-queue-ai-risk.log
stderr_logfile  = /var/log/supervisor/sbms-queue-ai-risk.err.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3

[program:sbms-queue-reports]
command         = php /var/www/html/workers/queue-worker.php reports
user            = www-data
autostart       = true
autorestart     = true
startretries    = 5
stdout_logfile  = /var/log/supervisor/sbms-queue-reports.log
stderr_logfile  = /var/log/supervisor/sbms-queue-reports.err.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 3

[group:sbms-workers]
programs = sbms-queue-notifications,sbms-queue-sms,sbms-queue-ai-risk,sbms-queue-reports
