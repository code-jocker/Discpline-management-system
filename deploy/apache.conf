# SBMS Apache Virtual Host — VPS / bare-metal production
# Copy to: /etc/apache2/sites-available/sbms.conf
# Enable: sudo a2ensite sbms.conf && sudo systemctl reload apache2
#
# Prerequisites:
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d your-domain.com

<VirtualHost *:80>
    ServerName  your-domain.com
    ServerAlias www.your-domain.com

    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName  your-domain.com
    ServerAlias www.your-domain.com
    DocumentRoot /var/www/sbms

    # SSL (managed by Certbot)
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/your-domain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-domain.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options          "SAMEORIGIN"
    Header always set X-Content-Type-Options   "nosniff"
    Header always set Referrer-Policy          "strict-origin-when-cross-origin"
    Header always set Permissions-Policy       "geolocation=(), microphone=(), camera=()"

    <Directory /var/www/sbms>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to sensitive directories and files
    <DirectoryMatch "^/var/www/sbms/(storage|workers|deploy|database|\.git)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "\.(sql|log|env|sh|lock|md|yml|json)$">
        Require all denied
    </FilesMatch>

    ErrorLog  /var/log/apache2/sbms-ssl-error.log
    CustomLog /var/log/apache2/sbms-ssl-access.log combined
</VirtualHost>
