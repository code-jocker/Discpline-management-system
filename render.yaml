services:
  - type: web
    name: sbms
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Africa/Kigali
      - key: SBMS_DB_HOST
        sync: false
      - key: SBMS_DB_PORT
        sync: false
      - key: SBMS_DB_NAME
        sync: false
      - key: SBMS_DB_USER
        sync: false
      - key: SBMS_DB_PASS
        sync: false
      - key: SBMS_DB_SSL_CA
        value: /var/www/html/deploy/aiven-ca.pem
      - key: ALLOWED_ORIGINS
        value: https://clever-c5b37.web.app,https://clever-c5b37.firebaseapp.com
